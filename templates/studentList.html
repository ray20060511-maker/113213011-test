<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>List Students from table</h1>
	<a href="/www/addForm.html">Add</a>
<hr>
	<table>
	<tr>
		<td>流水號</td>
		<td>學號</td>
		<td>姓名</td>
	</tr>
	{% for p in students %}
	<tr>
		<td>
		{{ loop.index }}:
		<a href="/student/edit/{{p.stuid }}">Edit</a>
		<a href="/student/delete/{{p.stuid}}" onclick="return confirm('確定要刪除 {{p.name}} 嗎？');" style="color: red;">Delete</a>
		</td>
		<td>{{ p.stuid }} </td>
		<td>{{ p.name }}</td>
	</tr>
	{% endfor %}
	</table>
</hr>
</body>
</html>
