<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>新增學生資料</title>
</head>
<body>
    <h1>新增學生資料</h1>
    <form action="/www/addForm.html" method="post">
        <label>學號 (stuid):</label>
        <input type="number" name="stuid" required><br><br>

        <label>姓名 (name):</label>
        <input type="text" name="name" required><br><br>

        <label>身高 (height):</label>
        <input type="number" name="height" required><br><br>

        <button type="submit">確認新增</button>
    </form>
    <br>
    <a href="/students/list/template">返回學生列表</a>
</body>
</html>
